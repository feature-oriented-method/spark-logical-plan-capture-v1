name: CI - Test and Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build twine pytest
    
    - name: Lint with twine check
      run: |
        python -m build
        twine check dist/*
    
    - name: Test import
      run: |
        python -c "import spark_logical_plan_capture; print('Import successful')"
        python -c "from spark_logical_plan_capture import get_jar_path, get_spark_config; print('Functions imported successfully')"
        python -c "from spark_logical_plan_capture.sql_restore import project_json_to_sql; print('SQL restore imported successfully')"
    
    - name: Verify JAR file exists
      run: |
        python -c "from spark_logical_plan_capture.runtime import get_jar_path; import os; jar_path = get_jar_path(); assert os.path.exists(jar_path), f'JAR not found at {jar_path}'; print(f'JAR found at: {jar_path}')"

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build twine
    
    - name: Build package
      run: python -m build
    
    - name: Check distribution
      run: twine check dist/*
    
    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
